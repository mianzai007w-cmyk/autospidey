<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCA Study Material Portal</title>
  <link rel="icon" href="https://img.icons8.com/color/48/graduation-cap.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header / Navbar -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-red-600/30">
          <i class="fa-solid fa-graduation-cap text-white"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white leading-none">ACCA Portal</h1>
          <p class="text-xs text-slate-400">Study Materials & Notes</p>
        </div>
      </div>

      <!-- Auth State Button -->
      <div id="navAuthArea" class="flex items-center gap-3">
        <button id="openAuthBtn" onclick="openAuthModal()" class="px-4 py-2 text-xs font-semibold bg-red-600 hover:bg-red-700 text-white rounded-lg transition-all shadow-md shadow-red-600/20">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Login / Sign Up
        </button>
        <div id="userProfileBadge" class="hidden items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg">
          <i class="fa-solid fa-circle-user text-red-500"></i>
          <span id="navUserName" class="text-xs font-semibold text-slate-200"></span>
          <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-red-400 ml-2">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Hero Section -->
  <main class="mb-auto">
    <section class="bg-gradient-to-b from-slate-900 to-slate-800 text-white py-12 px-4 shadow-inner">
      <div class="max-w-4xl mx-auto text-center space-y-4">
        <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
          <i class="fa-solid fa-book-open"></i> Free ACCA PDF Library
        </span>
        <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Download ACCA Notes & Study Guides</h2>
        <p class="text-slate-300 text-sm max-w-xl mx-auto">Access free preparation resources for MA1, FA1, BT and advanced subjects.</p>

        <!-- Live Visitor Counter Badge -->
        <div class="pt-2 inline-flex items-center gap-2 bg-slate-800/80 backdrop-blur-sm border border-slate-700 px-4 py-2 rounded-full text-xs font-semibold text-slate-300 shadow-lg">
          <i class="fa-solid fa-eye text-red-400"></i>
          <span>Total Visitors:</span>
          <span id="visitorCount" class="text-red-400 font-bold text-sm">--</span>
        </div>
      </div>
    </section>

    <!-- Filter & Search Section -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6">
      <div class="bg-white rounded-2xl shadow-xl p-4 sm:p-6 border border-slate-100 flex flex-col md:flex-row gap-4 justify-between items-center">
        <!-- Subject Pills -->
        <div id="subjectTabs" class="flex flex-wrap gap-2 w-full md:w-auto">
          <!-- Dynamic Pills will render here -->
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" placeholder="Search PDF title..." class="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
      </div>
    </section>

    <!-- PDF Cards Grid -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div id="pdfGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- PDF cards dynamically rendered here -->
      </div>
      <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
        <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
        <p class="text-slate-500 font-medium text-sm">No ACCA PDFs found for this subject.</p>
      </div>
    </section>
  </main>

  <!-- Login / Signup Modal -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative border border-slate-100">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- Form Switcher Tabs -->
      <div class="flex border-b border-slate-100 mb-6">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-sm text-red-600 border-b-2 border-red-600">Log In</button>
        <button id="tabSignupBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-sm text-slate-400 hover:text-slate-600">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
          <input type="email" id="loginEmail" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-md shadow-red-600/20">Sign In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
          <input type="text" id="signupName" required placeholder="John Doe" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
          <input type="tel" id="signupPhone" required placeholder="+92 300 1234567" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
          <input type="email" id="signupEmail" required placeholder="student@example.com" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Create Password</label>
          <input type="password" id="signupPassword" minlength="6" required placeholder="At least 6 characters" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-md shadow-red-600/20">Create Account</button>
      </form>
    </div>
  </div>

  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
    <p>© 2026 ACCA Study Material Portal. All rights reserved.</p>
  </footer>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, runTransaction } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACVwVXRB_5nTFozs0PV22zd6wSpZuBVqE",
      authDomain: "reakweb.firebaseapp.com",
      databaseURL: "https://reakweb-default-rtdb.firebaseio.com",
      projectId: "reakweb",
      storageBucket: "reakweb.firebasestorage.app",
      messagingSenderId: "228639861953",
      appId: "1:228639861953:web:2941663bb550703b61b840"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let activeSubject = 'ALL';
    let allPdfs = [];
    let defaultSubjects = ['MA1', 'FA1', 'BT'];
    let customSubjects = [];

    // Local Auth State Check
    let currentUser = JSON.parse(localStorage.getItem('acca_user')) || null;

    window.addEventListener('DOMContentLoaded', () => {
      updateUserUI();
      incrementVisitorCount();
      loadSubjects();
      loadPDFs();
    });

    // Increment Visitor Count
    function incrementVisitorCount() {
      const visitorRef = ref(db, 'stats/visitors');
      if (!sessionStorage.getItem('visited')) {
        runTransaction(visitorRef, (currentValue) => {
          return (currentValue || 0) + 1;
        }).then(() => {
          sessionStorage.setItem('visited', 'true');
        });
      }
      onValue(visitorRef, (snapshot) => {
        document.getElementById('visitorCount').innerText = snapshot.val() || 0;
      });
    }

    // Load Subjects
    function loadSubjects() {
      const subjRef = ref(db, 'subjects');
      onValue(subjRef, (snapshot) => {
        const data = snapshot.val() || {};
        customSubjects = Object.values(data);
        renderSubjectTabs();
      });
    }

    function renderSubjectTabs() {
      const container = document.getElementById('subjectTabs');
      const allSubjs = ['ALL', ...new Set([...defaultSubjects, ...customSubjects])];
      
      container.innerHTML = allSubjs.map(sub => `
        <button onclick="setSubject('${sub}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${activeSubject === sub ? 'bg-red-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          ${sub}
        </button>
      `).join('');
    }

    window.setSubject = (sub) => {
      activeSubject = sub;
      renderSubjectTabs();
      renderPDFs();
    };

    // Load PDFs
    function loadPDFs() {
      const pdfRef = ref(db, 'pdfs');
      onValue(pdfRef, (snapshot) => {
        const data = snapshot.val() || {};
        allPdfs = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        renderPDFs();
      });
    }

    function renderPDFs() {
      const grid = document.getElementById('pdfGrid');
      const empty = document.getElementById('emptyState');
      const query = document.getElementById('searchInput').value.toLowerCase();

      let filtered = allPdfs.filter(pdf => {
        const matchesSub = activeSubject === 'ALL' || pdf.subject === activeSubject;
        const matchesQuery = pdf.title.toLowerCase().includes(query);
        return matchesSub && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(pdf => `
        <div class="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-2.5 py-1 bg-red-50 text-red-600 border border-red-100 rounded-lg text-[10px] font-bold uppercase">${pdf.subject}</span>
              <span class="text-[10px] text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${pdf.date || 'Recent'}</span>
            </div>
            <h3 class="font-bold text-slate-800 text-sm mb-2 line-clamp-2">${pdf.title}</h3>
          </div>
          <button onclick="downloadPdf('${pdf.url}')" class="mt-4 w-full py-2 bg-slate-900 hover:bg-red-600 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-download text-xs"></i> Download PDF
          </button>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderPDFs);

    // Download Handling with Auth Check
    window.downloadPdf = (url) => {
      if (!currentUser) {
        alert("Please log in or sign up first to download ACCA PDFs!");
        openAuthModal();
        return;
      }
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.download = 'ACCA_Material.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    // Auth Actions
    window.openAuthModal = () => document.getElementById('authModal').classList.remove('hidden');
    window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');
    window.switchAuthTab = (tab) => {
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('tabLoginBtn').className = 'flex-1 py-2 font-bold text-sm text-red-600 border-b-2 border-red-600';
        document.getElementById('tabSignupBtn').className = 'flex-1 py-2 font-bold text-sm text-slate-400 hover:text-slate-600';
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('tabSignupBtn').className = 'flex-1 py-2 font-bold text-sm text-red-600 border-b-2 border-red-600';
        document.getElementById('tabLoginBtn').className = 'flex-1 py-2 font-bold text-sm text-slate-400 hover:text-slate-600';
      }
    };

    window.handleSignup = (e) => {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      const userRef = ref(db, 'users');
      const newUserRef = push(userRef);
      const userData = {
        name,
        phone,
        email,
        password,
        createdAt: new Date().toLocaleDateString()
      };

      set(newUserRef, userData).then(() => {
        currentUser = userData;
        localStorage.setItem('acca_user', JSON.stringify(userData));
        updateUserUI();
        closeAuthModal();
        alert('Account created successfully!');
      });
    };

    window.handleLogin = (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const usersRef = ref(db, 'users');
      onValue(usersRef, (snapshot) => {
        const users = snapshot.val() || {};
        const found = Object.values(users).find(u => u.email === email && u.password === password);
        if (found) {
          currentUser = found;
          localStorage.setItem('acca_user', JSON.stringify(found));
          updateUserUI();
          closeAuthModal();
        } else {
          alert('Invalid email or password.');
        }
      }, { onlyOnce: true });
    };

    window.handleLogout = () => {
      localStorage.removeItem('acca_user');
      currentUser = null;
      updateUserUI();
    };

    function updateUserUI() {
      if (currentUser) {
        document.getElementById('openAuthBtn').classList.add('hidden');
        document.getElementById('userProfileBadge').classList.remove('hidden');
        document.getElementById('navUserName').innerText = currentUser.name;
      } else {
        document.getElementById('openAuthBtn').classList.remove('hidden');
        document.getElementById('userProfileBadge').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
