<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCA Admin Panel - PDF Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="h-full font-sans text-slate-800 bg-slate-50 antialiased p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-cloud-upload-alt text-brand-500"></i> Admin Material Management Panel
                    </h2>
                    <p class="text-xs text-slate-500 mt-0.5">Manage subjects and upload PDF study files to Realtime Database.</p>
                </div>
                <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-semibold flex items-center gap-1">
                    <i class="fas fa-shield-alt"></i> Authenticated Admin
                </span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-700 mb-2 uppercase tracking-wider">
                            <i class="fas fa-folder-plus text-blue-500"></i> Add New Subject
                        </h3>
                        <form onsubmit="handleAddSubject(event)" class="space-y-3">
                            <input type="text" id="new-subject-code" required placeholder="Subject Code (e.g. MA2, FA2)" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-bold uppercase focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2 rounded-lg text-xs transition">Add Subject</button>
                        </form>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-700 mb-3 uppercase tracking-wider">
                            <i class="fas fa-file-pdf text-red-500"></i> Upload PDF Document
                        </h3>
                        <form onsubmit="handleUploadPDF(event)" class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Select Subject</label>
                                <select id="pdf-subject-select" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-brand-500 bg-white focus:outline-none"></select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Document Title</label>
                                <input type="text" id="pdf-title-input" required placeholder="e.g. MA1 Practice Exam Kit 2024" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Description</label>
                                <textarea id="pdf-desc-input" rows="2" placeholder="Brief summary of document..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Direct PDF URL Link</label>
                                <input type="url" id="pdf-url-input" required placeholder="https://example.com/file.pdf" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </div>
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-xs transition shadow">Upload PDF File</button>
                        </form>
                    </div>
                </div>

                <div class="lg:col-span-2">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-bold text-slate-700">Uploaded Material List</h3>
                        <span id="admin-pdf-count" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">0 files</span>
                    </div>

                    <div class="overflow-x-auto rounded-xl border border-slate-200">
                        <table class="w-full text-left border-collapse bg-white">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 text-[11px] uppercase tracking-wider font-semibold border-b border-slate-200">
                                    <th class="p-3">Subject</th>
                                    <th class="p-3">Title</th>
                                    <th class="p-3">Uploaded</th>
                                    <th class="p-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="admin-pdf-table-body" class="divide-y divide-slate-100 text-xs"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SECURITY PASSWORD MODAL -->
    <div id="admin-pass-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fas fa-lock"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800">Admin Upload Verification</h3>
            <p class="text-xs text-slate-500 mt-1 mb-4">Enter security password <code class="bg-slate-100 px-1 rounded text-amber-600 font-bold">ahsan0315</code> to unlock.</p>

            <form onsubmit="verifyAdminPassword(event)" class="space-y-3">
                <input type="password" id="admin-pass-input" placeholder="Password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs text-center font-bold tracking-widest focus:ring-2 focus:ring-amber-500 focus:outline-none">
                <button type="submit" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg text-xs transition">Unlock Admin Panel</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        
            const firebaseConfig = {
                apiKey: "AIzaSyACVwVXRB_5nTFozs0PV22zd6wSpZuBVqE",
                authDomain: "reakweb.firebaseapp.com",
                databaseURL: "https://reakweb-default-rtdb.firebaseio.com",
                projectId: "reakweb",
                storageBucket: "reakweb.firebasestorage.app",
                messagingSenderId: "228639861953",
                appId: "1:228639861953:web:2941663bb550703b61b840"
            };
        

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.db = db;
        window.allSubjects = ["MA1", "FA1", "BT"];
        window.allPdfs = {};

        window.addEventListener('DOMContentLoaded', async () => {
            try { await signInAnonymously(auth); } catch(e) {}
            
            onValue(ref(db, 'subjects'), (snapshot) => {
                const data = snapshot.val();
                let subList = ["MA1", "FA1", "BT"];
                if (data) Object.values(data).forEach(s => { if (s && !subList.includes(s)) subList.push(s); });
                window.allSubjects = subList;
                renderSubjectDropdown();
            });

            onValue(ref(db, 'pdfs'), (snapshot) => {
                window.allPdfs = snapshot.val() || {};
                renderAdminPDFTable();
            });
        });

        window.verifyAdminPassword = function(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === 'ahsan0315') {
                document.getElementById('admin-pass-modal').classList.add('hidden');
            } else {
                alert("Incorrect Password!");
            }
        };

        window.handleAddSubject = function(e) {
            e.preventDefault();
            const code = document.getElementById('new-subject-code').value.trim().toUpperCase();
            if (!code) return;

            push(ref(db, 'subjects'), code).then(() => {
                document.getElementById('new-subject-code').value = '';
            });
        };

        window.handleUploadPDF = function(e) {
            e.preventDefault();
            const subject = document.getElementById('pdf-subject-select').value;
            const title = document.getElementById('pdf-title-input').value.trim();
            const desc = document.getElementById('pdf-desc-input').value.trim();
            const url = document.getElementById('pdf-url-input').value.trim();

            push(ref(db, 'pdfs'), {
                subject, title, desc: desc || "Official ACCA study document.", url,
                uploadedAt: new Date().toLocaleDateString()
            }).then(() => {
                document.getElementById('pdf-title-input').value = '';
                document.getElementById('pdf-desc-input').value = '';
                document.getElementById('pdf-url-input').value = '';
            });
        };

        window.deletePDF = function(key) {
            remove(ref(db, `pdfs/${key}`));
        };

        function renderSubjectDropdown() {
            const select = document.getElementById('pdf-subject-select');
            if (!select) return;
            select.innerHTML = window.allSubjects.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function renderAdminPDFTable() {
            const tbody = document.getElementById('admin-pdf-table-body');
            const countBadge = document.getElementById('admin-pdf-count');
            const keys = Object.keys(window.allPdfs);

            if (countBadge) countBadge.innerText = `${keys.length} files`;

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No PDFs uploaded.</td></tr>`;
                return;
            }

            tbody.innerHTML = keys.map(k => {
                const pdf = window.allPdfs[k];
                return `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-bold text-slate-700">${pdf.subject}</td>
                        <td class="p-3 text-slate-800 font-medium">${pdf.title}</td>
                        <td class="p-3 text-slate-400 text-[11px]">${pdf.uploadedAt || 'N/A'}</td>
                        <td class="p-3 text-right">
                            <button onclick="deletePDF('${k}')" class="text-red-500 hover:text-red-700 p-1">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
