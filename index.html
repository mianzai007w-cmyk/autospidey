<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCA Study Hub</title>
  <link rel="icon" href="https://img.icons8.com/color/48/graduation-cap.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header / Navbar -->
  <header class="bg-[#0B192C] text-white py-3.5 px-4 sm:px-8 border-b border-slate-800/80 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="bg-[#E60023] text-white text-xs sm:text-sm font-extrabold px-2.5 py-1 rounded-md tracking-wider">ACCA</span>
        <h1 class="text-base sm:text-lg font-bold text-white tracking-tight">Study Hub</h1>
      </div>

      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-2 bg-[#081220] border border-slate-800 px-3 py-1.5 rounded-full text-xs font-semibold text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Total Visitors:</span>
          <span id="headerVisitorCount" class="text-emerald-400 font-bold">--</span>
        </div>

        <div id="navAuthArea">
          <button id="openAuthBtn" onclick="openAuthModal()" class="px-4 py-1.5 text-xs font-semibold bg-[#E60023] hover:bg-red-700 text-white rounded-full transition shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-right-to-bracket text-xs"></i> Log In / Sign Up
          </button>
          
          <div id="userProfileBadge" class="hidden items-center gap-2 bg-[#081220] border border-slate-700/80 px-3 py-1.5 rounded-full text-xs font-semibold">
            <i class="fa-solid fa-circle-user text-emerald-400 text-sm"></i>
            <span id="navUserName" class="text-white font-medium">Student</span>
            <button onclick="handleLogout()" title="Logout" class="text-slate-400 hover:text-red-400 ml-1 transition">
              <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Hero Banner -->
  <main class="mb-auto">
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8">
      <div class="bg-[#0B192C] text-white rounded-2xl p-6 sm:p-10 relative overflow-hidden shadow-xl border border-slate-800/50 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
        <div class="space-y-3 max-w-2xl z-10">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold tracking-wide uppercase bg-emerald-950/80 text-emerald-400 border border-emerald-800/50">
            ACCA OFFICIAL RESOURCES
          </div>
          <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold tracking-tight text-white">
            Free Study Text & Practice Kits
          </h2>
          <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">
            Download PDFs for MA1, FA1, BT and advanced subjects. Select a subject below to view materials.
          </p>
        </div>

        <div class="z-10 w-full md:w-auto">
          <div class="bg-[#13243A]/90 border border-slate-700/60 rounded-xl p-4 sm:p-5 flex items-center gap-4 min-w-[210px] shadow-lg">
            <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center text-xl shrink-0">
              <i class="fa-solid fa-users"></i>
            </div>
            <div>
              <p class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">TOTAL VISITORS</p>
              <p id="heroVisitorCount" class="text-2xl font-black text-white leading-none mt-1">--</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Filter Pills & Search Bar -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
        <div id="subjectTabs" class="flex flex-wrap items-center gap-2"></div>
        <div class="relative w-full md:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" placeholder="Search study materials..." class="w-full pl-9 pr-4 py-2 text-xs bg-white border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#0B192C] shadow-sm">
        </div>
      </div>
    </section>

    <!-- PDF Cards Grid -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
      <div id="pdfGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-200">
        <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
        <p class="text-slate-500 font-medium text-sm">No ACCA PDFs found for this subject.</p>
      </div>
    </section>
  </main>

  <!-- Login / Signup Modal -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative border border-slate-100">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="flex border-b border-slate-100 mb-6">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-sm text-[#E60023] border-b-2 border-[#E60023]">Log In</button>
        <button id="tabSignupBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-sm text-slate-400 hover:text-slate-600">Sign Up</button>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
          <input type="email" id="loginEmail" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg outline-none">
        </div>
        <button type="submit" class="w-full bg-[#0B192C] text-white font-semibold py-2.5 rounded-lg text-xs">Sign In</button>
      </form>

      <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
          <input type="text" id="signupName" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
          <input type="tel" id="signupPhone" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
          <input type="email" id="signupEmail" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="signupPassword" minlength="6" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg outline-none">
        </div>
        <button type="submit" class="w-full bg-[#E60023] text-white font-semibold py-2.5 rounded-lg text-xs">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Firebase Firestore SDK Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, onSnapshot, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACVwVXRB_5nTFozs0PV22zd6wSpZuBVqE",
      authDomain: "reakweb.firebaseapp.com",
      projectId: "reakweb",
      storageBucket: "reakweb.firebasestorage.app",
      messagingSenderId: "228639861953",
      appId: "1:228639861953:web:2941663bb550703b61b840"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeSubject = 'ALL';
    let allPdfs = [];
    let defaultSubjects = ['MA1', 'FA1', 'BT'];
    let currentUser = JSON.parse(localStorage.getItem('acca_user')) || null;

    // Fast Cache Read for Visitor Counter
    const cachedCount = localStorage.getItem('cached_visitors') || '10';
    document.getElementById('headerVisitorCount').innerText = cachedCount;
    document.getElementById('heroVisitorCount').innerText = cachedCount;

    window.addEventListener('DOMContentLoaded', () => {
      updateUserUI();
      incrementVisitorCount();
      loadSubjects();
      loadPDFs();
    });

    // Increment & Sync Firestore Visitor Count
    async function incrementVisitorCount() {
      const visRef = doc(db, 'stats', 'visitors');
      if (!sessionStorage.getItem('visited')) {
        try {
          const snap = await getDoc(visRef);
          if (snap.exists()) {
            await updateDoc(visRef, { count: increment(1) });
          } else {
            await setDoc(visRef, { count: 1 });
          }
          sessionStorage.setItem('visited', 'true');
        } catch (e) { console.error(e); }
      }

      onSnapshot(visRef, (snap) => {
        if (snap.exists()) {
          const val = snap.data().count || 0;
          localStorage.setItem('cached_visitors', val);
          document.getElementById('headerVisitorCount').innerText = val;
          document.getElementById('heroVisitorCount').innerText = val;
        }
      });
    }

    // Realtime Firestore Subjects Listener
    function loadSubjects() {
      onSnapshot(collection(db, 'subjects'), (snapshot) => {
        const custom = snapshot.docs.map(doc => doc.data().name);
        const allSubjs = ['ALL', ...new Set([...defaultSubjects, ...custom])];
        document.getElementById('subjectTabs').innerHTML = allSubjs.map(sub => `
          <button onclick="setSubject('${sub}')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition shadow-sm ${
            activeSubject === sub ? 'bg-[#0B192C] text-white' : 'bg-white text-slate-700 border border-slate-200'
          }">
            ${sub === 'ALL' ? 'All Subjects' : sub}
          </button>
        `).join('');
      });
    }

    window.setSubject = (sub) => {
      activeSubject = sub;
      loadSubjects();
      renderPDFs();
    };

    // Realtime Firestore PDFs Listener
    function loadPDFs() {
      onSnapshot(collection(db, 'pdfs'), (snapshot) => {
        allPdfs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPDFs();
      });
    }

    function renderPDFs() {
      const grid = document.getElementById('pdfGrid');
      const empty = document.getElementById('emptyState');
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allPdfs.filter(pdf => {
        const matchesSub = activeSubject === 'ALL' || pdf.subject === activeSubject;
        const matchesQuery = (pdf.title || '').toLowerCase().includes(search);
        return matchesSub && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(pdf => `
        <div class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-2.5 py-0.5 bg-slate-100 border border-slate-200 text-slate-800 rounded-md text-[10px] font-bold tracking-wider uppercase">${pdf.subject}</span>
              <span class="text-[11px] text-slate-400 font-medium">${pdf.date || '10/9/2026'}</span>
            </div>
            <h3 class="font-extrabold text-slate-900 text-sm tracking-tight mb-1 uppercase">${pdf.title}</h3>
            <p class="text-xs text-slate-400 mb-4">Official ACCA study document.</p>
          </div>
          <div class="flex items-center justify-between pt-3 border-t border-slate-100">
            <span class="text-xs font-semibold text-slate-400 flex items-center gap-1.5"><i class="fa-solid fa-file-pdf text-red-500"></i> PDF File</span>
            <button onclick="downloadPdf('${pdf.url}')" class="px-4 py-1.5 bg-[#0B192C] hover:bg-slate-800 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5">
              <i class="fa-solid fa-download text-[10px]"></i> Download
            </button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderPDFs);

    window.downloadPdf = (url) => {
      if (!currentUser) {
        alert("Please log in or sign up first to download ACCA PDFs!");
        openAuthModal();
        return;
      }
      window.open(url, '_blank');
    };

    window.openAuthModal = () => document.getElementById('authModal').classList.remove('hidden');
    window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');
    
    window.switchAuthTab = (tab) => {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
    };

    window.handleSignup = async (e) => {
      e.preventDefault();
      const userData = {
        name: document.getElementById('signupName').value.trim(),
        phone: document.getElementById('signupPhone').value.trim(),
        email: document.getElementById('signupEmail').value.trim(),
        password: document.getElementById('signupPassword').value,
        createdAt: new Date().toLocaleDateString()
      };

      try {
        await addDoc(collection(db, 'users'), userData);
        currentUser = userData;
        localStorage.setItem('acca_user', JSON.stringify(userData));
        updateUserUI();
        closeAuthModal();
        alert('Account created successfully!');
      } catch (err) {
        alert('Error creating account: ' + err.message);
      }
    };

    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const q = query(collection(db, 'users'), where('email', '==', email), where('password', '==', password));
        const querySnap = await getDocs(q);
        if (!querySnap.empty) {
          currentUser = querySnap.docs[0].data();
          localStorage.setItem('acca_user', JSON.stringify(currentUser));
          updateUserUI();
          closeAuthModal();
        } else {
          alert('Invalid email or password.');
        }
      } catch (err) {
        alert('Error logging in: ' + err.message);
      }
    };

    window.handleLogout = () => {
      localStorage.removeItem('acca_user');
      currentUser = null;
      updateUserUI();
    };

    function updateUserUI() {
      if (currentUser) {
        document.getElementById('openAuthBtn').classList.add('hidden');
        document.getElementById('userProfileBadge').classList.remove('hidden');
        document.getElementById('userProfileBadge').classList.add('flex');
        document.getElementById('navUserName').innerText = currentUser.name;
      } else {
        document.getElementById('openAuthBtn').classList.remove('hidden');
        document.getElementById('userProfileBadge').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
