<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCA Admin Panel - Upload Materials</title>
  <link rel="icon" href="https://img.icons8.com/color/48/graduation-cap.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100">

  <!-- Security Password Lock Overlay -->
  <div id="lockScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
      <div class="w-12 h-12 bg-red-600/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-1">Admin Access Required</h2>
      <p class="text-xs text-slate-400 mb-4">Enter security password to unlock:</p>
      <input type="password" id="passcodeInput" placeholder="Enter password" class="w-full px-3 py-2 text-xs bg-slate-800 border border-slate-700 rounded-lg text-white mb-4 text-center focus:ring-2 focus:ring-red-500 outline-none">
      <button onclick="unlockAdmin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg text-xs transition">Unlock Admin Panel</button>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-red-500"></i> ACCA Admin Control
        </h1>
        <p class="text-xs text-slate-400">Manage ACCA Subjects and Upload PDF Study Materials</p>
      </div>
      <a href="index.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs rounded-lg transition">
        <i class="fa-solid fa-globe mr-1"></i> View Website
      </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Column: Add Subject & Upload PDF -->
      <div class="space-y-6">
        <!-- Add Subject Card -->
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-lg">
          <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
            <i class="fa-solid fa-folder-plus text-red-400"></i> Add New Subject
          </h2>
          <div class="flex gap-2">
            <input type="text" id="newSubjectInput" placeholder="e.g. MA2, F4, SBR" class="flex-1 px-3 py-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-white uppercase focus:ring-2 focus:ring-red-500 outline-none">
            <button onclick="handleAddSubject()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 text-xs font-semibold rounded-lg transition">Add</button>
          </div>
        </div>

        <!-- Upload PDF Form Card -->
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-lg space-y-4">
          <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-file-circle-plus text-red-400"></i> Upload PDF Material
          </h2>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Select Subject</label>
            <select id="subjectSelect" class="w-full px-3 py-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-red-500 outline-none">
              <!-- Dynamically populated -->
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">PDF Title</label>
            <input type="text" id="pdfTitleInput" placeholder="e.g. MA1 Complete Study Text 2026" class="w-full px-3 py-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-red-500 outline-none">
          </div>

          <!-- Upload Mode Toggle -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Upload Source</label>
            <div class="grid grid-cols-2 gap-2 text-xs mb-3">
              <button type="button" id="btnComputer" onclick="setUploadSource('file')" class="py-1.5 bg-red-600 text-white rounded-lg font-semibold">Computer File</button>
              <button type="button" id="btnUrl" onclick="setUploadSource('url')" class="py-1.5 bg-slate-900 text-slate-400 border border-slate-700 rounded-lg font-semibold">Web URL</button>
            </div>

            <!-- Computer File Input -->
            <div id="fileUploadContainer">
              <input type="file" id="pdfFileInput" accept=".pdf" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-700 cursor-pointer border border-slate-700 rounded-lg bg-slate-900 p-1">
            </div>

            <!-- URL Input -->
            <div id="urlUploadContainer" class="hidden">
              <input type="url" id="pdfUrlInput" placeholder="https://example.com/document.pdf" class="w-full px-3 py-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-red-500 outline-none">
            </div>
          </div>

          <button onclick="handlePdfUpload()" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-lg shadow-red-600/20">
            Publish PDF
          </button>
        </div>
      </div>

      <!-- Right Column: Live PDF Repository List -->
      <div class="lg:col-span-2">
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-lg">
          <h2 class="text-sm font-bold text-slate-200 mb-4 flex items-center justify-between">
            <span><i class="fa-solid fa-list-check text-red-400 mr-2"></i> Published PDFs</span>
            <span id="totalPdfBadge" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">0 Total</span>
          </h2>

          <div id="adminPdfList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
            <!-- Dynamically populated PDF list -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACVwVXRB_5nTFozs0PV22zd6wSpZuBVqE",
      authDomain: "reakweb.firebaseapp.com",
      databaseURL: "https://reakweb-default-rtdb.firebaseio.com",
      projectId: "reakweb",
      storageBucket: "reakweb.firebasestorage.app",
      messagingSenderId: "228639861953",
      appId: "1:228639861953:web:2941663bb550703b61b840"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUploadMode = 'file';
    let defaultSubjects = ['MA1', 'FA1', 'BT'];
    let customSubjects = [];

    window.unlockAdmin = () => {
      const val = document.getElementById('passcodeInput').value;
      if (val === 'ahsan0315') {
        document.getElementById('lockScreen').classList.add('hidden');
      } else {
        alert('Incorrect password!');
      }
    };

    window.setUploadSource = (mode) => {
      currentUploadMode = mode;
      if (mode === 'file') {
        document.getElementById('fileUploadContainer').classList.remove('hidden');
        document.getElementById('urlUploadContainer').classList.add('hidden');
        document.getElementById('btnComputer').className = 'py-1.5 bg-red-600 text-white rounded-lg font-semibold';
        document.getElementById('btnUrl').className = 'py-1.5 bg-slate-900 text-slate-400 border border-slate-700 rounded-lg font-semibold';
      } else {
        document.getElementById('fileUploadContainer').classList.add('hidden');
        document.getElementById('urlUploadContainer').classList.remove('hidden');
        document.getElementById('btnUrl').className = 'py-1.5 bg-red-600 text-white rounded-lg font-semibold';
        document.getElementById('btnComputer').className = 'py-1.5 bg-slate-900 text-slate-400 border border-slate-700 rounded-lg font-semibold';
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadSubjects();
      loadPdfs();
    });

    function loadSubjects() {
      onValue(ref(db, 'subjects'), (snapshot) => {
        customSubjects = Object.values(snapshot.val() || {});
        const select = document.getElementById('subjectSelect');
        const allSubjects = [...new Set([...defaultSubjects, ...customSubjects])];
        select.innerHTML = allSubjects.map(s => `<option value="${s}">${s}</option>`).join('');
      });
    }

    window.handleAddSubject = () => {
      const val = document.getElementById('newSubjectInput').value.trim().toUpperCase();
      if (!val) return;
      push(ref(db, 'subjects'), val).then(() => {
        document.getElementById('newSubjectInput').value = '';
      });
    };

    window.handlePdfUpload = () => {
      const subject = document.getElementById('subjectSelect').value;
      const title = document.getElementById('pdfTitleInput').value.trim();

      if (!title) {
        alert('Please enter a PDF title.');
        return;
      }

      if (currentUploadMode === 'url') {
        const url = document.getElementById('pdfUrlInput').value.trim();
        if (!url) return alert('Please enter a valid PDF URL.');
        savePdfToDb(subject, title, url);
      } else {
        const fileInput = document.getElementById('pdfFileInput');
        if (!fileInput.files[0]) return alert('Please select a PDF file from your computer.');
        
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
          savePdfToDb(subject, title, e.target.result);
        };
        reader.readAsDataURL(file);
      }
    };

    function savePdfToDb(subject, title, urlData) {
      const newRef = push(ref(db, 'pdfs'));
      set(newRef, {
        subject,
        title,
        url: urlData,
        date: new Date().toLocaleDateString()
      }).then(() => {
        document.getElementById('pdfTitleInput').value = '';
        document.getElementById('pdfUrlInput').value = '';
        document.getElementById('pdfFileInput').value = '';
        alert('PDF published successfully!');
      });
    }

    function loadPdfs() {
      onValue(ref(db, 'pdfs'), (snapshot) => {
        const data = snapshot.val() || {};
        const items = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        document.getElementById('totalPdfBadge').innerText = `${items.length} Total`;
        
        const container = document.getElementById('adminPdfList');
        if (items.length === 0) {
          container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No uploaded PDFs yet.</div>`;
          return;
        }

        container.innerHTML = items.map(item => `
          <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-xs">
            <div class="flex items-center gap-3">
              <span class="px-2 py-0.5 bg-red-950 text-red-400 border border-red-900/50 rounded font-bold">${item.subject}</span>
              <span class="font-semibold text-slate-200">${item.title}</span>
            </div>
            <button onclick="deletePdf('${item.id}')" class="text-slate-500 hover:text-red-400 p-1">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `).join('');
      });
    }

    window.deletePdf = (id) => {
      if (confirm('Are you sure you want to delete this PDF?')) {
        remove(ref(db, `pdfs/${id}`));
      }
    };
  </script>
</body>
</html>
